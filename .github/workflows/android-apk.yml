name: Build CLAYKO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare public APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CLAYKO.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLAYKO-Android-APK
          path: CLAYKO.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: CLAYKO Android v1.0.0
          prerelease: true
          make_latest: false
          files: CLAYKO.apk
